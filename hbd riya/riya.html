<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Riya!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Pacifico&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #fdfbfb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.5s ease;
            padding: 20px;
        }

        body.party-mode {
            animation: discoBg 3s infinite alternate;
        }

        @keyframes discoBg {
            0% { background: #ff9a9e; }
            33% { background: #fecfef; }
            66% { background: #a1c4fd; }
            100% { background: #c2e9fb; }
        }

        .card {
            background: #ffffff;
            width: 90%;
            max-width: 380px;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            text-align: center;
            border-top: 6px solid #ff7675;
            position: relative;
            transition: all 0.3s ease;
        }

        body.party-mode .card {
            box-shadow: 0 0 30px rgba(255, 118, 117, 0.6);
            border-top: 6px solid #a29bfe;
        }

        .cake-icon {
            font-size: 40px;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* PHOTO STYLING */
        .photo-frame {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffeaa7;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin: 0 auto 15px auto;
            display: block;
            background: #f1f2f6; /* in case photo takes time to load */
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #2d3436;
            font-size: 2em;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .subtitle {
            color: #636e72;
            font-size: 0.9em;
            margin-bottom: 25px;
        }

        .message {
            color: #2d3436;
            font-size: 1em;
            line-height: 1.5;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 0;
        }

        .message.show {
            opacity: 1;
            max-height: 300px;
            transform: translateY(0);
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed #dfe6e9;
        }

        .btn {
            background: #ff7675;
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, box-shadow 0.3s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(255, 118, 117, 0.4);
            width: 100%;
            max-width: 250px;
        }

        .btn:hover {
            background: #d63031;
            box-shadow: 0 6px 20px rgba(214, 48, 49, 0.4);
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <audio id="bdaySong" src="hbd.mp3" preload="auto"></audio>

    <div class="card">
        <div class="cake-icon">🎂</div>
        
        <!-- YAHAN APNI PHOTO LAGAYEIN -->
        <!-- 'src' ke andar apni photo ka naam likhein (jaise 'riya_photo.jpg') -->
        <img class="photo-frame" src="1787592009855_temp.jpg" alt="Riya">
        
        <h1>Happy Birthday,<br>Riya!</h1>
        <div class="subtitle">A special day for a special sister.</div>
        
        <button class="btn" onclick="triggerMagic()">Tap for Magic ✨</button>
        
        <div class="message" id="secretMessage">
            <p>Wishing you a day as wonderful as you are! May your year ahead be sweet, happy, and filled with moments as amazing as a two-tiered chocolate cake decorated with golden spheres. 🍫✨</p>
        </div>
    </div>

    <script>
        function triggerMagic() {
            const msg = document.getElementById('secretMessage');
            const btn = document.querySelector('.btn');
            const song = document.getElementById('bdaySong');
            const body = document.body;
            
            msg.classList.toggle('show');
            
            if (msg.classList.contains('show')) {
                btn.innerText = "Stop Magic 🪄";
                body.classList.add('party-mode');
                
                let playPromise = song.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("Audio block by mobile browser auto-play policy: ", error);
                    });
                }
                
                if (navigator.vibrate) {
                    navigator.vibrate([200, 100, 200, 100, 400, 100, 400]);
                }
                
            } else {
                btn.innerText = "Tap for Magic ✨";
                body.classList.remove('party-mode');
                
                song.pause();
                song.currentTime = 0; 
                
                if (navigator.vibrate) {
                    navigator.vibrate(0);
                }
            }
        }
    </script>

</body>
</html>
